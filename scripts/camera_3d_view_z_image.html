<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Camera View - ZImage</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a0a0f;
            font-family: Arial, sans-serif;
        }
        #container-z-image {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        .controls-z-image {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 5px;
            z-index: 100;
        }
        select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 5px;
            margin: 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="container-z-image"></div>
    
    <div class="controls-z-image">
        <div>
            <label>方位角:</label>
            <select id="azimuth-select-z-image">
                <option value="0">正面</option>
                <option value="45">前右四分之三</option>
                <option value="90">右侧</option>
                <option value="135">后右四分之三</option>
                <option value="180">背面</option>
                <option value="225">后左四分之三</option>
                <option value="270">左侧</option>
                <option value="315">前左四分之三</option>
            </select>
        </div>
        <div>
            <label>高程角:</label>
            <select id="elevation-select-z-image">
                <option value="-30">低角度</option>
                <option value="0">平视</option>
                <option value="30">仰拍</option>
                <option value="60">高角度</option>
            </select>
        </div>
        <div>
            <label>距离:</label>
            <select id="distance-select-z-image">
                <option value="8">特写</option>
                <option value="4">中景</option>
                <option value="1">远景</option>
            </select>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 初始化Three.js场景
        let scene, camera, renderer;
        let cameraIndicator, azimuthHandle, elevationHandle, distanceHandle;
        let azimuth = 0, elevation = 0, distance = 4;  // 确保初始值与默认选择一致
        
        // 鼠标控制相关变量
        let isDragging = false;
        let selectedHandle = null;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let plane = new THREE.Plane();
        let planeNormal = new THREE.Vector3();
        let intersection = new THREE.Vector3();
        let worldPosition = new THREE.Vector3();
        let offset = new THREE.Vector3();
        
        // 将数值转换为对应的角度描述
        function getValueToDescription() {
            // 确保角度值被正确映射到有效范围
            // 使用Math.round()确保浮点数精度问题不会影响映射
            const roundedAzimuth = Math.round(azimuth);
            const roundedElevation = Math.round(elevation);
            const roundedDistance = Math.round(distance);

            console.log('Raw angles:', {azimuth, elevation, distance}); // 添加错误检查
            console.log('Rounded angles:', {roundedAzimuth, roundedElevation, roundedDistance}); // 添加错误检查

            // 定义有效的角度值数组
            const validAzimuths = [0, 45, 90, 135, 180, 225, 270, 315];
            const validElevations = [-30, 0, 30, 60];
            const validDistances = [8, 4, 1];

            // 找到最接近的有效值
            const getClosestValue = (value, values) => {
                return values.reduce((prev, curr) => 
                    Math.abs(curr - value) < Math.abs(prev - value) ? curr : prev
                );
            };

            const closestAzimuth = getClosestValue(roundedAzimuth, validAzimuths);
            const closestElevation = getClosestValue(roundedElevation, validElevations);
            const closestDistance = getClosestValue(roundedDistance, validDistances);

            const azimuthMap = {
                0: "front view",
                45: "front-right quarter view", 
                90: "right side view",
                135: "back-right quarter view",
                180: "back view",
                225: "back-left quarter view",
                270: "left side view",
                315: "front-left quarter view"
            };
            
            const elevationMap = {
                "-30": "low-angle shot",
                0: "eye-level shot",
                30: "elevated shot",
                60: "high-angle shot"
            };
            
            const distanceMap = {
                8: "close-up",
                4: "medium shot",
                1: "wide shot"
            };
            
            // 检查映射是否存在
            const azimuthResult = azimuthMap[closestAzimuth];
            const elevationResult = elevationMap[closestElevation];
            const distanceResult = distanceMap[closestDistance];
            
            console.log('Mapping results:', {
                azimuth: azimuthResult,
                elevation: elevationResult,
                distance: distanceResult
            }); // 添加错误检查
            
            const result = {
                azimuth: azimuthResult || "",
                elevation: elevationResult || "",
                distance: distanceResult || ""
            };
            
            console.log('Final mapped result:', result); // 添加错误检查
            
            return result;
        }
        
        function init() {
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0f);
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(4, 3.5, 4);
            camera.lookAt(0, 0.3, 0);
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.getElementById('container-z-image').appendChild(renderer.domElement);
            
            // 添加光照
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            mainLight.position.set(5, 10, 5);
            scene.add(mainLight);
            
            const fillLight = new THREE.DirectionalLight(0xE93D82, 0.3);
            fillLight.position.set(-5, 5, -5);
            scene.add(fillLight);
            
            // 添加网格
            const gridHelper = new THREE.GridHelper(5, 20, 0x1a1a2e, 0x12121a);
            gridHelper.position.y = -0.01;
            scene.add(gridHelper);
            
            // 创建中心主体对象
            const CENTER = new THREE.Vector3(0, 0.5, 0);
            const cardThickness = 0.02;
            const cardGeo = new THREE.BoxGeometry(1.2, 1.2, cardThickness);
            
            const frontMat = new THREE.MeshBasicMaterial({ color: 0x3a3a4a });
            const backMat = new THREE.MeshBasicMaterial({ color: 0x1a1a2a });
            const edgeMat = new THREE.MeshBasicMaterial({ color: 0x1a1a2a });
            
            const cardMaterials = [edgeMat, edgeMat, edgeMat, edgeMat, frontMat, backMat];
            const imagePlane = new THREE.Mesh(cardGeo, cardMaterials);
            imagePlane.position.copy(CENTER);
            scene.add(imagePlane);
            
            // 主体边框
            const frameGeo = new THREE.EdgesGeometry(cardGeo);
            const frameMat = new THREE.LineBasicMaterial({ color: 0xE93D82 });
            const imageFrame = new THREE.LineSegments(frameGeo, frameMat);
            imageFrame.position.copy(CENTER);
            scene.add(imageFrame);
            
            // 方位角环 (红色)
            const AZIMUTH_RADIUS = 1.8;
            const azRingGeo = new THREE.TorusGeometry(AZIMUTH_RADIUS, 0.04, 16, 100);
            const azRingMat = new THREE.MeshBasicMaterial({
                color: 0xE93D82,
                transparent: true,
                opacity: 0.7
            });
            const azimuthRing = new THREE.Mesh(azRingGeo, azRingMat);
            azimuthRing.rotation.x = Math.PI / 2;
            azimuthRing.position.y = 0.02;
            scene.add(azimuthRing);
            
            // 方位角手柄 (红色)
            const azHandleGeo = new THREE.SphereGeometry(0.16, 32, 32);
            const azHandleMat = new THREE.MeshStandardMaterial({
                color: 0xE93D82,
                emissive: 0xE93D82,
                emissiveIntensity: 0.6,
                metalness: 0.3,
                roughness: 0.4
            });
            azimuthHandle = new THREE.Mesh(azHandleGeo, azHandleMat);
            scene.add(azimuthHandle);
            
            // 高程角弧线 (绿色)
            const ELEVATION_RADIUS = 1.4;
            const ELEV_ARC_X = -0.8;
            const arcPoints = [];
            for (let i = 0; i <= 32; i++) {
                const angle = (-30 + (90 * i / 32)) * Math.PI / 180;
                arcPoints.push(new THREE.Vector3(
                    ELEV_ARC_X,
                    ELEVATION_RADIUS * Math.sin(angle) + CENTER.y,
                    ELEVATION_RADIUS * Math.cos(angle)
                ));
            }
            const arcCurve = new THREE.CatmullRomCurve3(arcPoints);
            const elArcGeo = new THREE.TubeGeometry(arcCurve, 32, 0.04, 8, false);
            const elArcMat = new THREE.MeshBasicMaterial({
                color: 0x00FFD0,
                transparent: true,
                opacity: 0.8
            });
            const elevationArc = new THREE.Mesh(elArcGeo, elArcMat);
            scene.add(elevationArc);
            
            // 高程角手柄 (绿色)
            const elHandleGeo = new THREE.SphereGeometry(0.16, 32, 32);
            const elHandleMat = new THREE.MeshStandardMaterial({
                color: 0x00FFD0,
                emissive: 0x00FFD0,
                emissiveIntensity: 0.6,
                metalness: 0.3,
                roughness: 0.4
            });
            elevationHandle = new THREE.Mesh(elHandleGeo, elHandleMat);
            scene.add(elevationHandle);
            
            // 距离手柄 (黄色)
            const distHandleGeo = new THREE.SphereGeometry(0.15, 32, 32);
            const distHandleMat = new THREE.MeshStandardMaterial({
                color: 0xFFB800,
                emissive: 0xFFB800,
                emissiveIntensity: 0.7,
                metalness: 0.5,
                roughness: 0.3
            });
            distanceHandle = new THREE.Mesh(distHandleGeo, distHandleMat);
            scene.add(distanceHandle);
            
            // 相机指示器
            const camGeo = new THREE.ConeGeometry(0.15, 0.4, 4);
            const camMat = new THREE.MeshStandardMaterial({
                color: 0x3498db,
                emissive: 0x3498db,
                emissiveIntensity: 0.5,
                metalness: 0.8,
                roughness: 0.2
            });
            cameraIndicator = new THREE.Mesh(camGeo, camMat);
            scene.add(cameraIndicator);
            
            // 绑定事件
            document.getElementById('azimuth-select-z-image').addEventListener('change', function() {
                azimuth = parseFloat(this.value);
                updateVisuals();
                console.log('Azimuth changed to:', azimuth);
            });
            
            document.getElementById('elevation-select-z-image').addEventListener('change', function() {
                elevation = parseFloat(this.value);
                updateVisuals();
                console.log('Elevation changed to:', elevation);
            });
            
            document.getElementById('distance-select-z-image').addEventListener('change', function() {
                distance = parseFloat(this.value);
                updateVisuals();
                console.log('Distance changed to:', distance);
            });
            
            // 监听来自父窗口的消息
            window.addEventListener('message', function(event) {
                console.log('ZImage Message received:', event.data); // 添加错误检查
                if (event.data.type === 'GET_CURRENT_ANGLE_Z_IMAGE') {
                    console.log('Received GET_CURRENT_ANGLE_Z_IMAGE message');
                    // 确保在返回之前角度值是最新的
                    // 在返回前再次确保下拉菜单值与内部状态同步
                    updateDropdowns();
                    
                    const desc = getValueToDescription();
                    console.log('Current angles:', {azimuth, elevation, distance});
                    console.log('Converted description:', desc);
                    
                    // 检查描述是否有效
                    if (!desc.azimuth && !desc.elevation && !desc.distance) {
                        console.error('Invalid angle description returned:', desc);
                    }
                    
                    // 返回当前角度值 - 发送到parent（iframe的宿主页面）
                    try {
                        parent.postMessage({
                            type: 'ANGLE_SELECTED_Z_IMAGE',
                            azimuth: desc.azimuth,
                            elevation: desc.elevation,
                            distance: desc.distance
                        }, '*');
                        console.log('Message sent to parent:', {
                            azimuth: desc.azimuth,
                            elevation: desc.elevation,
                            distance: desc.distance
                        });
                    } catch (error) {
                        console.error('Error sending message to parent:', error);
                    }
                }
            });
            
            // 鼠标事件
            renderer.domElement.addEventListener('mousedown', onMouseDown);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('mouseup', onMouseUp);
            
            // 确保所有初始化完成后再发送就绪信号
            setTimeout(() => {
                console.log('Sending CAMERA_3D_READY_Z_IMAGE signal');
                parent.postMessage({ type: 'CAMERA_3D_READY_Z_IMAGE' }, '*');
            }, 100);
            
            // 窗口大小调整
            window.addEventListener('resize', onWindowResize, false);
            
            // 开始动画循环
            animate();
            
            // 立即设置初始值并更新
            document.getElementById('azimuth-select-z-image').value = "0";
            document.getElementById('elevation-select-z-image').value = "0";
            document.getElementById('distance-select-z-image').value = "4";
            
            // 立即更新全局变量
            azimuth = 0;
            elevation = 0;
            distance = 4;
            
            console.log('Immediate initial values set:', {
                azimuth: document.getElementById('azimuth-select').value,
                elevation: document.getElementById('elevation-select').value,
                distance: document.getElementById('distance-select').value
            });
            
            console.log('Global variables immediately updated:', {azimuth, elevation, distance});
            
            // 立即更新可视化
            updateVisuals();
            
            // 触发change事件确保完全同步
            document.getElementById('azimuth-select-z-image').dispatchEvent(new Event('change'));
            document.getElementById('elevation-select-z-image').dispatchEvent(new Event('change'));
            document.getElementById('distance-select-z-image').dispatchEvent(new Event('change'));
            
            // 初始更新
            updateVisuals();
        }
        
        function onMouseDown(event) {
            event.preventDefault();
            
            // 计算鼠标位置
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // 设置射线
            raycaster.setFromCamera(mouse, camera);
            
            // 检测与手柄的交集
            const intersects = raycaster.intersectObjects([
                azimuthHandle, 
                elevationHandle, 
                distanceHandle
            ]);
            
            if (intersects.length > 0) {
                isDragging = true;
                selectedHandle = intersects[0].object;
                
                // 计算偏移量
                worldPosition.setFromMatrixPosition(selectedHandle.matrixWorld);
                planeNormal.copy(worldPosition).sub(camera.position).normalize();
                plane.setFromNormalAndCoplanarPoint(planeNormal, worldPosition);
                
                raycaster.ray.intersectPlane(plane, intersection);
                offset.copy(worldPosition).sub(intersection);
            }
        }
        
        function onMouseMove(event) {
            if (isDragging && selectedHandle) {
                // 计算鼠标位置
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                
                // 更新射线
                raycaster.setFromCamera(mouse, camera);
                
                // 计算新的位置
                raycaster.ray.intersectPlane(plane, intersection);
                selectedHandle.position.copy(intersection.add(offset));
                
                // 根据拖动的手柄类型更新参数
                if (selectedHandle === azimuthHandle) {
                    // 计算方位角（基于xz平面）
                    const dx = selectedHandle.position.x;
                    const dz = selectedHandle.position.z;
                    let rawAzimuth = (Math.atan2(dx, dz) * 180 / Math.PI + 360) % 360;
                    
                    // 将方位角映射到最接近的有效值
                    const validAngles = [0, 45, 90, 135, 180, 225, 270, 315];
                    let closestAngle = validAngles[0];
                    let minDiff = Math.abs(rawAzimuth - validAngles[0]);
                    
                    for (let i = 1; i < validAngles.length; i++) {
                        let diff = Math.abs(rawAzimuth - validAngles[i]);
                        if (diff < minDiff) {
                            minDiff = diff;
                            closestAngle = validAngles[i];
                        }
                    }
                    
                    // 实时更新全局变量
                    window.azimuth = azimuth = closestAngle;
                } else if (selectedHandle === elevationHandle) {
                    // 计算高程角（基于yz平面）
                    const dy = selectedHandle.position.y - 0.5; // 相对中心的高度差
                    const dz = selectedHandle.position.z - 0.5; // 简化的计算
                    // 使用atan2计算角度
                    let rawElevation = Math.atan2(dy, dz) * 180 / Math.PI;
                    
                    // 将高程角映射到最接近的有效值
                    const validElevations = [-30, 0, 30, 60];
                    let closestElevation = validElevations[0];
                    let minDiff = Math.abs(rawElevation - validElevations[0]);
                    
                    for (let i = 1; i < validElevations.length; i++) {
                        let diff = Math.abs(rawElevation - validElevations[i]);
                        if (diff < minDiff) {
                            minDiff = diff;
                            closestElevation = validElevations[i];
                        }
                    }
                    
                    // 实时更新全局变量
                    window.elevation = elevation = closestElevation;
                } else if (selectedHandle === distanceHandle) {
                    // 计算距离（基于到中心点的距离）
                    const distVec = new THREE.Vector3();
                    const centerPos = new THREE.Vector3(0, 0.5, 0);
                    const distanceToCenter = distVec.subVectors(selectedHandle.position, centerPos).length();
                    
                    // 根据距离确定镜头类型，映射到最接近的有效值
                    let rawDistance;
                    if (distanceToCenter < 1.0) {
                        rawDistance = 8; // 特写
                    } else if (distanceToCenter < 1.8) {
                        rawDistance = 4; // 中景
                    } else {
                        rawDistance = 1; // 远景
                    }
                    
                    // 实时更新全局变量
                    window.distance = distance = rawDistance;
                }
                
                // 确保更新下拉菜单
                updateDropdowns();
                
                // 更新下拉菜单值到DOM
                const azimuthSelect = document.getElementById('azimuth-select');
                const elevationSelect = document.getElementById('elevation-select');
                const distanceSelect = document.getElementById('distance-select');
                
                if (azimuthSelect) azimuthSelect.value = azimuth;
                if (elevationSelect) elevationSelect.value = elevation;
                if (distanceSelect) distanceSelect.value = distance;
                
                // 触发change事件以确保同步
                if (azimuthSelect) azimuthSelect.dispatchEvent(new Event('change'));
                if (elevationSelect) elevationSelect.dispatchEvent(new Event('change'));
                if (distanceSelect) distanceSelect.dispatchEvent(new Event('change'));
                
                // 更新其他组件
                updateVisuals();
            }
        }
        
        function onMouseUp() {
            if (isDragging) {
                isDragging = false;
                selectedHandle = null;
                
                // 确保在拖动结束后更新下拉菜单
                updateDropdowns();
                
                // 确保在拖动结束后更新所有可视化效果
                updateVisuals();
                
                // 确保角度值被正确保存
                console.log('Mouse up - Final angles:', {azimuth, elevation, distance});
                
                // 验证角度值是否在有效范围内
                const validAzimuth = [0, 45, 90, 135, 180, 225, 270, 315];
                const validElevation = [-30, 0, 30, 60];
                const validDistance = [8, 4, 1];
                
                console.log('Azimuth valid:', validAzimuth.includes(Math.round(azimuth)));
                console.log('Elevation valid:', validElevation.includes(Math.round(elevation)));
                console.log('Distance valid:', validDistance.includes(Math.round(distance)));
                
                // 确保下拉菜单值与当前角度值同步，并触发change事件
                const azimuthSelect = document.getElementById('azimuth-select');
                const elevationSelect = document.getElementById('elevation-select');
                const distanceSelect = document.getElementById('distance-select');
                
                azimuthSelect.value = azimuth;
                elevationSelect.value = elevation;
                distanceSelect.value = distance;
                
                // 触发change事件以确保同步
                azimuthSelect.dispatchEvent(new Event('change'));
                elevationSelect.dispatchEvent(new Event('change'));
                distanceSelect.dispatchEvent(new Event('change'));
                
                // 确保同步更新
                updateVisuals();
                
                // 输出最终角度值用于调试
                const desc = getValueToDescription();
                console.log('On mouse up, current description:', desc);
                
                // 立即更新下拉菜单，确保下次获取值时是最新的
                updateDropdowns();
            }
        }
        
        function updateDropdowns() {
            // 更新方位角下拉框
            const azimuthSelect = document.getElementById('azimuth-select-z-image');
            if (azimuthSelect && !isNaN(azimuth)) {
                // 找到最接近的角度值选项
                const validAngles = [0, 45, 90, 135, 180, 225, 270, 315];
                let closestAngle = validAngles[0];
                let minDiff = Math.abs(azimuth - validAngles[0]);
                
                for (let i = 1; i < validAngles.length; i++) {
                    let diff = Math.abs(azimuth - validAngles[i]);
                    if (diff < minDiff) {
                        minDiff = diff;
                        closestAngle = validAngles[i];
                    }
                }
                
                // 使用找到的最接近值更新下拉框
                azimuthSelect.value = closestAngle.toString();
            }
            
            // 更新高程角下拉框
            const elevationSelect = document.getElementById('elevation-select-z-image');
            if (elevationSelect && !isNaN(elevation)) {
                const validElevations = [-30, 0, 30, 60];
                let closestElevation = validElevations[0];
                let minDiff = Math.abs(elevation - validElevations[0]);
                
                for (let i = 1; i < validElevations.length; i++) {
                    let diff = Math.abs(elevation - validElevations[i]);
                    if (diff < minDiff) {
                        minDiff = diff;
                        closestElevation = validElevations[i];
                    }
                }
                
                elevationSelect.value = closestElevation.toString();
            }
            
            // 更新距离下拉框
            const distanceSelect = document.getElementById('distance-select-z-image');
            if (distanceSelect && !isNaN(distance)) {
                const validDistances = [8, 4, 1]; // close-up, medium shot, wide shot
                let closestDistance = validDistances[0];
                let minDiff = Math.abs(distance - validDistances[0]);
                
                for (let i = 1; i < validDistances.length; i++) {
                    let diff = Math.abs(distance - validDistances[i]);
                    if (diff < minDiff) {
                        minDiff = diff;
                        closestDistance = validDistances[i];
                    }
                }
                
                distanceSelect.value = closestDistance.toString();
            }
            
            console.log('ZImage Updated dropdowns:', {azimuth, elevation, distance});
            console.log('ZImage Dropdown values set to:', {
                azimuth: document.getElementById('azimuth-select-z-image').value,
                elevation: document.getElementById('elevation-select-z-image').value,
                distance: document.getElementById('distance-select-z-image').value
            });
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function updateVisuals() {
            const azRad = (azimuth * Math.PI) / 180;
            const elRad = (elevation * Math.PI) / 180;
            const visualDist = 2.6 - (distance / 10) * 2.0;
            
            // 相机指示器
            const camX = visualDist * Math.sin(azRad) * Math.cos(elRad);
            const camY = 0.5 + visualDist * Math.sin(elRad);
            const camZ = visualDist * Math.cos(azRad) * Math.cos(elRad);
            
            cameraIndicator.position.set(camX, camY, camZ);
            cameraIndicator.lookAt(new THREE.Vector3(0, 0.5, 0));
            cameraIndicator.rotateX(Math.PI / 2);
            
            // 方位角手柄
            const azX = 1.8 * Math.sin(azRad);
            const azZ = 1.8 * Math.cos(azRad);
            azimuthHandle.position.set(azX, 0.16, azZ);
            
            // 高程角手柄
            const elY = 0.5 + 1.4 * Math.sin(elRad);
            const elZ = 1.4 * Math.cos(elRad);
            elevationHandle.position.set(-0.8, elY, elZ);
            
            // 距离手柄
            const distT = 0.15 + ((10 - distance) / 10) * 0.7;
            const direction = new THREE.Vector3(camX, camY - 0.5, camZ).normalize();
            distanceHandle.position.set(
                0 + direction.x * distT * Math.abs(camX),
                0.5 + direction.y * distT * Math.abs(camY - 0.5),
                0 + direction.z * distT * Math.abs(camZ)
            );
        }
        
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        
        // 初始化
        init();
    </script>
</body>
</html>
